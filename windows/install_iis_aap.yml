---
- name: Install IIS
  hosts: all
  vars:
    iis_message: "Test web content"
    site_name: "test19.dac.nc.gov"
    site_path: 'C:\Site\test19.dac.nc.gov'
    cert_type: "selfsigned"

  tasks:
    - name: Install IIS
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_management_tools: true
      register: iis_install

    - name: Reboot if necessary
      ansible.windows.win_reboot:
      when: iis_install.reboot_required

    - name: Start IIS service
      ansible.windows.win_service:
        name: W3Svc
        state: started
        start_mode: auto

    - name: Create site directory
      ansible.windows.win_file:
        path: '{{ site_path }}'
        state: directory

    - name: Generate self-signed certificate
      ansible.windows.win_powershell:
        script: |
          $cert = Get-ChildItem -Path Cert:\LocalMachine\My |
            Where-Object { $_.Subject -eq "CN={{ site_name }}" }
          if ($cert) {
            $Ansible.Changed = $false
            $Ansible.Result = @{ thumbprint = $cert.Thumbprint }
          } else {
            $newCert = New-SelfSignedCertificate -DnsName "{{ site_name }}" -CertStoreLocation Cert:\LocalMachine\My
            $Ansible.Result = @{ thumbprint = $newCert.Thumbprint }
          }
      register: selfsigned_cert_result
      when: cert_type == "selfsigned"

    - name: Write fullchain PEM to temp file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ cert_fullchain }}"
        dest: /tmp/fullchain.pem
        mode: '0600'
      when: cert_type == "letsencrypt"
      no_log: true

    - name: Write private key to temp file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ cert_privkey }}"
        dest: /tmp/privkey.pem
        mode: '0600'
      when: cert_type == "letsencrypt"
      no_log: true

    - name: Convert PEM certificates to PFX
      delegate_to: localhost
      community.crypto.openssl_pkcs12:
        path: /tmp/demo.test19.dac.nc.gov.pfx
        certificate_path: /tmp/fullchain.pem
        privatekey_path: /tmp/privkey.pem
        passphrase: "{{ pfx_password }}"
        friendly_name: "{{ site_name }}"
        action: export
        state: present
      when: cert_type == "letsencrypt"
      no_log: true

    - name: Create certificate directory
      ansible.windows.win_file:
        path: 'C:\certs'
        state: directory
      when: cert_type == "letsencrypt"

    - name: Copy PFX to Windows host
      ansible.windows.win_copy:
        src: /tmp/test19.dac.nc.gov.pfx
        dest: 'C:\certs\test19.dac.nc.gov.pfx'
      when: cert_type == "letsencrypt"

    - name: Import certificate
      ansible.windows.win_certificate_store:
        path: 'C:\certs\test19.dac.nc.gov.pfx'
        password: "{{ pfx_password }}"
        store_location: LocalMachine
        store_name: My
        key_exportable: true
        key_storage: machine
        state: present
      register: le_cert_result
      when: cert_type == "letsencrypt"

    - name: Clean up temp files
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/fullchain.pem
        - /tmp/privkey.pem
        - /tmp/test19.dac.nc.gov.pfx
      when: cert_type == "letsencrypt"
      no_log: true

    - name: Set certificate thumbprint
      ansible.builtin.set_fact:
        cert_thumbprint: "{{ selfsigned_cert_result.result.thumbprint if cert_type == 'selfsigned' else le_cert_result.thumbprints[0] }}"

    - name: Create IIS website with HTTPS binding
      microsoft.iis.website:
        name: "{{ site_name }}"
        physical_path: '{{ site_path }}'
        state: started
        bindings:
          add:
            - hostname: "{{ site_name }}"
              protocol: https
              port: 443
              certificate_hash: "{{ cert_thumbprint }}"
              certificate_store_name: My
              use_sni: true

    - name: Allow HTTPS through firewall
      community.windows.win_firewall_rule:
        name: Allow HTTPS
        localport: 443
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Create website index.html
      ansible.windows.win_template:
        src: index.html.j2
        dest: '{{ site_path }}\index.html'

    - name: Show website address
      ansible.builtin.debug:
        msg: "https://{{ site_name }}"

...
